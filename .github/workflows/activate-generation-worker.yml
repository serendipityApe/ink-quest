name: Update verified text generation Worker
on:
  workflow_dispatch:
  push:
    branches: [feat/generation-edge-worker-20261106]
    paths: [.github/generation-worker-activation-request.json]
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tools/generation-worker/tests/activation-checks.test.mjs
      - run: pnpm --filter @inkquest/generation-worker build
      - name: Verify requested gate mode, deploy compatible Worker, then verify again
        env:
          CLOUDFLARE_ACCOUNT_ID: fdfece8b5c135c21fa630440b8dbf2e4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          # Only this exact marker mode opts into preserving already-active flags.
          MODE=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {gateArgsForRequest} from "./tools/generation-worker/activation_checks.mjs"; console.log(gateArgsForRequest(JSON.parse(readFileSync(".github/generation-worker-activation-request.json","utf8"))).join(" "));')
          if [ "$MODE" = "--keep-active" ]; then
            node tools/generation-worker/activation_checks.mjs after --keep-active
            pnpm exec wrangler deploy --config tools/generation-worker/wrangler.jsonc
            node tools/generation-worker/activation_checks.mjs after --keep-active --post-deploy
          else
            node tools/generation-worker/activation_checks.mjs after
            pnpm exec wrangler deploy --config tools/generation-worker/wrangler.jsonc
            node tools/generation-worker/activation_checks.mjs after
          fi
      # Existing credentials only. No secret relay, database writes, model call,
      # frontend deployment, paid plan change, or automatic backend activation.
