name: Activate verified text generation Worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tools/generation-worker/tests/activation-checks.test.mjs
      - run: pnpm --filter @inkquest/generation-worker build
      - name: Verify dictionary and closed entry, deploy, then verify consumer and Cron
        env:
          CLOUDFLARE_ACCOUNT_ID: fdfece8b5c135c21fa630440b8dbf2e4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node tools/generation-worker/activation_checks.mjs before
          pnpm exec wrangler deploy --config tools/generation-worker/wrangler.jsonc --keep-vars
          node tools/generation-worker/activation_checks.mjs after
      # Existing credentials only. No secret relay, database writes, model call,
      # frontend deployment, paid plan change, or automatic backend activation.
