name: Verify isolated dictionary assets on Free
on:
  push:
    branches: [feat/generation-edge-worker-20261106]
    paths: [tools/generation-worker/asset-dictionary/remote-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-generation-cpu-canary-20261106
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate uploaded isolated version and measure five fixed fixtures once
        env:
          CLOUDFLARE_ACCOUNT_ID: fdfece8b5c135c21fa630440b8dbf2e4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
        run: node tools/generation-worker/asset-dictionary/verify_remote.mjs --inspect
