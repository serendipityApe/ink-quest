name: Measure five remaining isolated CPU fixtures
on:
  push:
    branches: [feat/generation-edge-worker-20261106]
    paths:
      - .github/workflows/continue-generation-cpu-canary.yml
      - tools/generation-worker/continue_cpu_canary.mjs
permissions:
  contents: read
concurrency:
  group: isolated-generation-cpu-canary-20261106
  cancel-in-progress: false
jobs:
  existing-canary-five-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify first provider CPU and existing version before five remaining messages
        env:
          CLOUDFLARE_ACCOUNT_ID: fdfece8b5c135c21fa630440b8dbf2e4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
        run: node tools/generation-worker/continue_cpu_canary.mjs
      # No deployment, new resources, secrets, production queue, billing or login.
