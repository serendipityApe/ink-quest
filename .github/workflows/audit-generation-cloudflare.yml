name: Audit generation Cloudflare access read-only
on:
  push:
    branches: [feat/generation-edge-worker-20261106]
    paths:
      - .github/workflows/audit-generation-cloudflare.yml
      - tools/generation-worker/audit_cloudflare.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: generation-cloudflare-read-only-audit
  cancel-in-progress: false
jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read existing account metadata and stop at any denial
        env:
          CLOUDFLARE_ACCOUNT_ID: fdfece8b5c135c21fa630440b8dbf2e4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
        run: node tools/generation-worker/audit_cloudflare.mjs
      # No install, deploy, secret upload, publish/pull, token update or login.
