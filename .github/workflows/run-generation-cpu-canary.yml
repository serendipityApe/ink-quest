name: Run isolated generation CPU canary
on:
  # The authorized six-message experiment is complete. No automatic reruns.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-generation-cpu-canary-20261106
  cancel-in-progress: false
jobs:
  isolated-free-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @inkquest/generation-worker build:canary
      - name: Create isolated resources and measure one message before continuing
        env:
          CLOUDFLARE_ACCOUNT_ID: fdfece8b5c135c21fa630440b8dbf2e4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
        run: node tools/generation-worker/run_cpu_canary.mjs
      # No billing endpoints, login, key upload, production queue or paid CPU override.
